name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Test schema
      run: npm run test:schema

    - name: Install dependencies
      run: npm ci --production
    
    - name: Build if build script exists
      run: npm run build --if-present
    
    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
        
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/booksmartly
          git pull origin main
          npm ci --production
          cd frontend
          npm ci
          npm run build
          cd ..
          pm2 reload ecosystem.config.js --update-env

    - name: Log success
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          echo '2025-06-23 – Main branch deployment completed – $(git rev-parse --short HEAD)' >> /var/log/booksmartly/progress.log