name: Deploy to VPS

on:
  push:
    branches: [ "hotfix/jun-16-backend-auth-routes" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Test schema
      run: npm run test:schema

    - name: Install dependencies
      run: npm ci --production
    
    - name: Build if build script exists
      run: npm run build --if-present
    
    - name: Build Client
      run: |
        cd Client
        npm ci
        npm run build
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          rm -rf /var/www/booksmartly/backend
          cd /var/www/booksmartly
          git pull origin hotfix/jun-16-backend-auth-routes
          npm ci --production
          pm2 reload ecosystem.config.js --update-env

    - name: Copy static
      run: rsync -a Client/build/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/booksmartly/client

    - name: Log success
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          ssh $DEPLOY_USER@$VPS "echo '2025-06-22 – GlowLabs migration fully live – $(git rev-parse --short HEAD)' >> /var/log/booksmartly/progress.log"